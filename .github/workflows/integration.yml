name: Weekly Integration Tests

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch: # Allow manual triggering from the Actions tab

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build

      - name: Start undeployed stack
        run: docker compose -f tools/compose-undeployed.yml up -d --wait

      - name: Write integration test environment
        run: |
          # .env.integration is gitignored and absent in CI after checkout.
          # Write it from scratch; setup.ts loads it with override:true.
          cat > .env.integration <<'EOF'
          INTEGRATION_ARLOCAL_URL=http://localhost:1984
          INTEGRATION_PROOF_SERVER=http://localhost:6300
          INTEGRATION_MIDNIGHT_NETWORK=undeployed
          INTEGRATION_NODE_ENDPOINT=http://127.0.0.1:9944
          INTEGRATION_NODE_WS_ENDPOINT=ws://127.0.0.1:9944
          INTEGRATION_INDEXER_ENDPOINT=http://127.0.0.1:8088/api/v4/graphql
          INTEGRATION_INDEXER_WS_ENDPOINT=ws://127.0.0.1:8088/api/v4/graphql/ws
          INTEGRATION_SEED=abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art
          INTEGRATION_CONTRACT_ADDRESS=
          EOF

      - name: Wait for proof server
        # The proof-server image (Nix-built, no shell in PATH) cannot carry a
        # Docker healthcheck, so docker compose --wait does not block on it.
        # Poll from the host until the HTTP port responds, which the server
        # opens only after ZK circuits are fully loaded (~60-120 s on CI).
        run: |
          echo "Waiting for proof server on http://localhost:6300 ..."
          for i in $(seq 1 36); do
            if curl -s --connect-timeout 3 --max-time 5 http://localhost:6300 >/dev/null 2>&1; then
              echo "Proof server ready after ~$((i * 5))s"
              exit 0
            fi
            echo "  attempt $i/36 – not ready yet"
            sleep 5
          done
          echo "ERROR: proof server did not become ready within 180s"
          docker logs midnight-proof-server --tail 50 || true
          exit 1

      - name: Fund test wallet (NIGHT + DUST)
        # fund-wallet.sh auto-clones midnightntwrk/midnight-local-dev (the
        # official tool) and installs deps via npm when the directory is
        # absent. It always funds NIGHT + registers DUST together.
        run: |
          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art"
          for attempt in 1 2 3; do
            echo "Fund attempt $attempt/3..."
            if ./tools/fund-wallet.sh "$MNEMONIC"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 60s..."
              sleep 60
            fi
          done
          echo "All fund attempts failed"
          exit 1

      - name: Start bundler mock server
        # Local mock signing server + mock ArDrive bundler (tools/mock-bundler-server.ts):
        # relays uploads into real arlocal transactions. No external credentials
        # or real funds involved. Placed after arlocal has been up for a couple
        # of minutes already (proof-server wait + wallet funding above), so no
        # startup-race retry is needed here.
        run: |
          nohup npx tsx tools/mock-bundler-server.ts > mock-bundler.log 2>&1 &
          echo $! > mock-bundler.pid

      - name: Wait for bundler mock server and record auth token
        run: |
          echo "Waiting for bundler mock server..."
          for i in $(seq 1 30); do
            if grep -q "INTEGRATION_BUNDLER_AUTH_TOKEN=" mock-bundler.log 2>/dev/null; then
              echo "Bundler mock server ready after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: bundler mock server did not become ready within 60s"
              cat mock-bundler.log || true
              exit 1
            fi
            sleep 2
          done
          TOKEN=$(grep "INTEGRATION_BUNDLER_AUTH_TOKEN=" mock-bundler.log | tail -1 | cut -d'=' -f2-)
          {
            echo "INTEGRATION_BUNDLER_MOCK_SERVER_URL=http://localhost:8901"
            echo "INTEGRATION_BUNDLER_AUTH_TOKEN=${TOKEN}"
          } >> .env.integration

      - name: Run integration tests
        run: npm run test:integration
