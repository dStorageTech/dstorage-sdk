services:
  # ── Midnight local network ──────────────────────────────────────────────────

  proof-server:
    image: "midnightntwrk/proof-server:8.1.0"
    container_name: proof-server
    ports:
      - "6300:6300"

  indexer:
    image: "midnightntwrk/indexer-standalone:4.3.5"
    container_name: indexer
    # On a fresh "undeployed" chain the SPO sub-service can start before the
    # node has produced block 1 ("Cannot construct OnlineClientAtBlock: block
    # number 1 not found"), which is fatal to the whole indexer process.
    # Restarting recovers automatically once the node has block 1 — a fixed
    # retry cap can be exhausted before that (restarts land faster than the
    # node's block time), so retry indefinitely instead.
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=info,info"
      # Random 32-byte hex-encoded secret used to make the standalone indexer run.
      # Only needed to satisfy the config schema – not meant for secure use.
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: "ws://node:9944"
      # Mandatory since indexer-standalone 4.3.2 for the SPO/Cardano bridge
      # config section. Not used by this local devnet — placeholder only.
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "dummy-not-using-spo"
      # spo_node.url defaults to ws://localhost:9944, which inside the
      # indexer container is itself, not the node service — leaving it
      # unset makes the SPO client's connection attempt fail and crash the
      # whole indexer process a few minutes after startup.
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      start_interval: "5s"
      interval: "5s"
      timeout: "2s"
      retries: 2
      start_period: 5s
    depends_on:
      node:
        condition: service_started

  node:
    image: "midnightntwrk/midnight-node:1.0.1"
    container_name: node
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      CFG_PRESET: "dev"

  # ── Arweave local (arlocal) ─────────────────────────────────────────────────

  arlocal:
    image: textury/arlocal
    container_name: arlocal
    ports:
      - "1984:1984"
